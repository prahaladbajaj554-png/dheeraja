<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_28_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#grad_28_0)"/>
  
  <!-- Subtle Mandala / Radial Ornaments -->
  <circle cx="300" cy="320" r="240" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="300" cy="320" r="200" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>
  
  <!-- Outer Gold Border Frame -->
  <rect x="25" y="25" width="550" height="700" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="35" y="35" width="530" height="680" rx="18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Top Ribbon Badges -->
  <g transform="translate(50, 60)">
    <rect width="150" height="34" rx="17" fill="#059669" fill-opacity="0.95"/>
    <text x="20" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">🛡️ Verified ID</text>
  </g>
  <g transform="translate(380, 60)">
    <rect width="170" height="34" rx="17" fill="url(#goldGrad)"/>
    <text x="22" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#3D0C17">👑 ROYAL VIP</text>
  </g>

  <!-- Central Avatar Portrait Ring -->
  <circle cx="300" cy="320" r="140" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.3"/>
  <circle cx="300" cy="320" r="125" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="300" cy="320" r="116" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Portrait Silhouette Graphic -->
  <g transform="translate(300, 320)">
    <!-- Head -->
    <circle cx="0" cy="-25" r="52" fill="#FDE047" fill-opacity="0.9"/>
    <!-- Body / Shoulders -->
    <path d="M -85,90 C -85,15 -45,20 0,20 C 45,20 85,15 85,90 Z" fill="#FDE047" fill-opacity="0.8"/>
    <!-- Monogram Initial -->
    <text x="0" y="-10" font-family="Cinzel, serif" font-size="48" font-weight="bold" fill="#3D0C17" text-anchor="middle">K</text>
  </g>

  <!-- Verified Photo Checkmark Shield -->
  <g transform="translate(385, 395)">
    <circle cx="0" cy="0" r="26" fill="#0284C7" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M -10,-2 L -3,6 L 11,-8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card Info Bar -->
  <rect x="50" y="510" width="500" height="175" rx="20" fill="#000000" fill-opacity="0.65" stroke="rgba(212,175,55,0.4)" stroke-width="1.5"/>
  
  <text x="300" y="555" font-family="Cinzel, serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kritika Agarwal</text>
  <text x="300" y="585" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#FDE047" text-anchor="middle">DM10028 • Photo 1 of 4</text>
  <text x="300" y="615" font-family="Plus Jakarta Sans, sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">Graceful Portrait • VP Investment Banking</text>
  
  <g transform="translate(300, 650)">
    <rect x="-120" y="-16" width="240" height="32" rx="16" fill="rgba(2,132,199,0.9)"/>
    <text x="0" y="5" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">📸 Photo Verified Profile</text>
  </g>

</svg>